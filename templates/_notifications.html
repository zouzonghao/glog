<div id="notification-container"></div>
<style>
    #notification-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3000;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
    }
    .notification {
        color: var(--color-text-primary, #22272a);
        padding: 8px 16px;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,.1);
        opacity: 0;
        transform: translateY(-20px);
        transition: opacity .3s, transform .3s;
        min-width: 240px;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: .9rem;
        background-color: var(--color-background-transparent, rgba(250, 250, 250, 0.8));
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,.05);
        margin-bottom: 10px;
    }
    html.dark .notification {
        border: 1px solid rgba(255,255,255,.1);
    }
    .notification.show {
        opacity: 1;
        transform: translateY(0);
    }
    .notification.success { background-color: rgba(40,167,70,.458); border: none; }
    .notification.error { background-color: rgba(220,53,70,.475); border: none; }
    .notification.info { background-color: rgba(23,163,184,.572); border: none; }
    html.dark .notification.success { background-color: rgba(40,167,70,.458); }
    html.dark .notification.error { background-color: rgba(220,53,70,.475); }
    html.dark .notification.info { background-color: rgba(23,163,184,.572); }
</style>

{{ template "base.html" . }}

{{ define "title" }}标签{{ end }}

{{ define "content" }}
    <div id="home-page">
        <h2 class="group-title">全部标签</h2>
        <div class="tags-container">
            {{ range .tags }}
                <a href="/search?tag={{ . }}" class="tag-item"># {{ . }}</a>
            {{ else }}
                <p>暂无标签。</p>
            {{ end }}
        </div>
    </div>
{{ end }}
